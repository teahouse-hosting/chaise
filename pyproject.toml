[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[project]
name = "chaise"
description = "An async Python client for CouchDB"
license = "Artistic-2.0"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27,<0.29",
    "anyio>=4.4.0,<5",
    "attrs>=23.2,<25.0",
    "cattrs>=23.2.3,<25.0.0",
    "ckdl>=1.0,<2.0",
]

[[project.authors]]
name = "Jamie Bliss"
email = "jamie@ivyleav.es"

[project.optional-dependencies]
attrs = [
    "attrs>=23.2,<25.0",
    "cattrs>=23.2.3,<25.0.0",
]
testing = ["docker (>=7.1.0,<8.0.0)"]

[project.scripts]
chaise = "chaise.cli:entry"


[tool.poetry]
requires-poetry = ">=2.0"
version = "0.0.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }


[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
anyio = {extras = ["trio"], version = "^4.4.0"}
pytest-cov = ">=5,<7"
attrs = ">=23.2,<25.0"
cattrs = ">=23.2.3,<25.0.0"
docker = "^7.1.0"
mypy = "^1.14.1"
types-docker = "^7.1.0.20241229"


[tool.poetry.group.docs.dependencies]
sphinx = "^8.2.3"
furo = "^2024.8.6"
sphinxext-opengraph = "^0.9.1"
sphinx-inline-tabs = "^2023.4.21"
sphinx-autobuild = "^2024.4.16"
sphinx-copybutton = "^0.5.2"
sphinxcontrib-httpdomain = "^1.8.1"
sphinx-argparse = "^0.5.2"

[tool.poetry-dynamic-versioning]
enable = true
dirty = true
bump = true

[tool.mypy]
mypy_path = "stubs"
